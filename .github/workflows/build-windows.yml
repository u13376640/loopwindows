name: Build Loop Windows Executable

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: windows/package.json

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: windows/src-tauri

      - name: Install Frontend Dependencies
        working-directory: windows
        run: npm install

      - name: Build Tauri Windows App
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: windows
          tagName: v__VERSION__
          releaseName: 'Loop Windows v__VERSION__'
          releaseBody: 'Loop Windows Release with direct uBlock Origin extension support'
          releaseDraft: false
          prerelease: false

      - name: Upload Windows Artifacts (.msi and .exe)
        uses: actions/upload-artifact@v4
        with:
          name: loop-windows-binaries
          path: |
            windows/src-tauri/target/release/bundle/msi/*.msi
            windows/src-tauri/target/release/bundle/nsis/*.exe
            windows/src-tauri/target/release/*.exe
          if-no-files-found: warn
