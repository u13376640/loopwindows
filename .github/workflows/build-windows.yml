name: Build Loop Windows Executable

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22 (LTS)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: windows/package.json

      - name: Setup Rust Stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: windows/src-tauri

      - name: Install Frontend Dependencies & Build UI
        working-directory: windows
        run: |
          npm install
          npm run build

      - name: Compile Standalone Windows Application
        working-directory: windows
        run: npx @tauri-apps/cli build

      - name: Upload Windows Installers (.msi and .exe)
        uses: actions/upload-artifact@v4
        with:
          name: loop-windows-binaries
          path: |
            windows/src-tauri/target/release/bundle/msi/*.msi
            windows/src-tauri/target/release/bundle/nsis/*.exe
            windows/src-tauri/target/release/*.exe
          if-no-files-found: warn
