name: Build Loop Windows Executable

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22 (LTS)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: windows/package.json

      - name: Setup Rust Stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: windows/src-tauri

      - name: Install Frontend Dependencies & Build UI
        working-directory: windows
        run: |
          npm install
          npm run build

      - name: Compile Native Windows Executable (Cargo)
        working-directory: windows/src-tauri
        run: cargo build --release

      - name: Assemble Windows App Bundle
        working-directory: windows
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist-package
          Copy-Item src-tauri\target\release\loop-windows.exe dist-package\Loop.exe
          Copy-Item Loop.bat dist-package\Loop.bat
          Copy-Item README.md dist-package\README.md
          Copy-Item -Recurse profile dist-package\profile
          Compress-Archive -Path dist-package\* -DestinationPath Loop-Windows-Firefox.zip -Force

      - name: Upload Windows Executables & Package
        uses: actions/upload-artifact@v4
        with:
          name: loop-windows-firefox
          path: |
            windows/Loop-Windows-Firefox.zip
            windows/src-tauri/target/release/loop-windows.exe
          if-no-files-found: error
