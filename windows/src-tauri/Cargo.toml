[package]
name = "loop-windows"
version = "1.0.0"
description = "High-performance Loop Windows Desktop Client"
authors = ["Loop Team"]
edition = "2021"
build = "build.rs"

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.0", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rusqlite = { version = "0.31", features = ["bundled"] }
sha2 = "0.10"
hex = "0.4"
directories = "5.0"
log = "0.4"
env_logger = "0.11"
